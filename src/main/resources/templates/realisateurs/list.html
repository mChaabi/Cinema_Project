<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}"> 
<head>
    <title>Réalisateurs List</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4">Réalisateur Management</h2>
            
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                Director saved successfully! 
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.deleted}" class="alert alert-warning alert-dismissible fade show" role="alert">
                Director deleted successfully! 
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-primary card-outline shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title m-0">Directors List</h3>
                    <a th:href="@{/admin/realisateurs/add}" class="btn btn-sm btn-primary ms-auto">
                        <i class="bi bi-plus-lg"></i> Add New Director
                    </a>
                </div>
                
                <div class="card-body">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 5%">ID</th>
                                <th style="width: 10%" class="text-center">Photo</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Date of Birth</th>
                                <th style="width: 15%" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="realisateur : ${realisateurs}">
                                <td th:text="${realisateur.id}">1</td>
                                
                                <td class="text-center">
                                    <i th:if="${realisateur.photo == null or realisateur.photo.isEmpty()}" class="bi bi-person-bounding-box text-muted fs-4"></i>
                                    <img th:if="${realisateur.photo != null and !realisateur.photo.isEmpty()}" th:src="@{${realisateur.photo}}" alt="Photo" class="img-thumbnail rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                                </td>
                                
                                <td th:text="${realisateur.prenom}">Christopher</td>
                                <td th:text="${realisateur.nom}">Nolan</td>
                                <td th:text="${#dates.format(realisateur.dateNaissance, 'yyyy-MM-dd')}">1970-07-30</td>
                                
                                <td class="text-center">
                                    <a th:href="@{/admin/realisateurs/edit/{id}(id=${realisateur.id})}" class="btn btn-sm btn-info text-white me-1">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    
                                    <form th:action="@{/admin/realisateurs/delete/{id}(id=${realisateur.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this director?');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(realisateurs)}">
                                <td colspan="6" class="text-center text-muted py-4">No directors found in the database.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
