<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}">
<head>
    <title>Customer Account Form</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4" th:text="${customer != null and customer.id != null ? 'Edit Customer Account' : 'Add New Customer Account'}">Add New Customer</h2>

            <div class="row">
                <div class="col-md-6">
                    <div class="card card-primary card-outline shadow-sm">
                        <div class="card-header">
                            <h3 class="card-title m-0">Customer Account Details</h3>
                        </div>

                        <div th:if="${param.error != null and param.error[0] == 'passwordRequired'}" class="alert alert-danger m-3" role="alert">
                            Password is required for new customer accounts.
                        </div>

                        <form th:action="@{/admin/customers/save}" th:object="${customer}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" th:field="*{username}" class="form-control" placeholder="e.g. jdoe123" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. customer@example.com" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="Enter password">
                                    <div class="form-text" th:if="${customer != null and customer.id != null}">
                                        Leave blank to keep the current password.
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer d-flex justify-content-between">
                                <a th:href="@{/admin/customers}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save Customer Account</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
