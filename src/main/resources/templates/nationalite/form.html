<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}"> 
<head>
    <title>Nationality Form</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4" th:text="${nationalite != null and nationalite.id != null ? 'Edit Nationality' : 'Add New Nationality'}">Add New Nationality</h2>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card card-primary card-outline shadow-sm">
                        <div class="card-header">
                            <h3 class="card-title m-0">Nationality Details</h3>
                        </div>
                        
                        <form th:action="@{/admin/nationalites/save}" th:object="${nationalite}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Nationality Name</label>
                                    <!-- Update 'libelle' if your entity uses 'nom' instead -->
                                    <input type="text" th:field="*{libelle}" class="form-control" placeholder="e.g. Marocaine, Française, American" required>
                                </div>
                            </div>
                            
                            <div class="card-footer d-flex justify-content-between">
                                <a th:href="@{/admin/nationalites}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save Nationality</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
