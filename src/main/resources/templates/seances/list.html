<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}">
<head>
    <title>Séances List</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4">Séance Management</h2>

            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                Séance saved successfully!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.deleted}" class="alert alert-warning alert-dismissible fade show" role="alert">
                Séance deleted successfully!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-primary card-outline shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title m-0">Screenings List</h3>
                    <a th:href="@{/admin/seances/add}" class="btn btn-sm btn-primary ms-auto">
                        <i class="bi bi-plus-lg"></i> Add New Séance
                    </a>
                </div>

                <div class="card-body">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 5%">ID</th>
                                <th>Date</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Film</th>
                                <th>Salle</th>
                                <th style="width: 15%" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="seance : ${seances}">
                                <td th:text="${seance.id}">1</td>
                                <td th:text="${seance.dateProjection != null ? #dates.format(seance.dateProjection, 'yyyy-MM-dd') : '-'}">2026-10-15</td>
                                <td th:text="${seance.heureDebut != null ? #dates.format(seance.heureDebut, 'HH:mm') : '-'}">20:00</td>
                                <td th:text="${seance.heureFin != null ? #dates.format(seance.heureFin, 'HH:mm') : '-'}">22:30</td>
                                <td th:text="${seance.filmId != null ? seance.filmId : '-'}">Inception</td>
                                <td th:text="${seance.salleId != null ? 'Salle ' + seance.salleId : '-'}">Salle 1</td>

                                <td class="text-center">
                                    <a th:href="@{/admin/seances/edit/{id}(id=${seance.id})}" class="btn btn-sm btn-info text-white me-1">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <form th:action="@{/admin/seances/delete/{id}(id=${seance.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this séance?');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(seances)}">
                                <td colspan="7" class="text-center text-muted py-4">No screenings found in the database.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
