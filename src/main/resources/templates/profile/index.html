<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>User Profile</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4">My Profile</h2>

            <!-- Feedback Messages -->
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                Profile details updated successfully!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.passwordSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
                Password changed successfully!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <!-- Personal Info Card -->
                <div class="col-md-6 mb-4">
                    <div class="card card-primary card-outline shadow-sm">
                        <div class="card-header">
                            <h3 class="card-title m-0"><i class="bi bi-person-gear me-2"></i>Edit Profile Info</h3>
                        </div>
                        <form th:action="@{/profile/update}" method="post">
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="prenom" class="form-control" value="Admin" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="nom" class="form-control" value="User" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email address</label>
                                    <input type="email" name="email" class="form-control" value="admin@ecine.com" required>
                                </div>
                            </div>
                            <div class="card-footer text-end">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Password Update Card -->
                <div class="col-md-6 mb-4">
                    <div class="card card-warning card-outline shadow-sm">
                        <div class="card-header">
                            <h3 class="card-title m-0"><i class="bi bi-shield-lock me-2"></i>Change Password</h3>
                        </div>
                        <form th:action="@{/profile/update-password}" method="post">
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" name="oldPassword" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password" name="newPassword" class="form-control" required>
                                </div>
                            </div>
                            <div class="card-footer text-end">
                                <button type="submit" class="btn btn-warning">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
