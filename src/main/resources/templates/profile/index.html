<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}">
<head>
    <title>User Profile</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4">My Profile</h2>

            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                Profile details updated successfully!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.passwordSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
                Password changed successfully!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.error != null and param.error[0] == 'wrongPassword'}" class="alert alert-danger alert-dismissible fade show" role="alert">
                The current password you entered is incorrect.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.error != null and param.error[0] == 'usernameTaken'}" class="alert alert-danger alert-dismissible fade show" role="alert">
                That username is already taken by another administrator.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <!-- Personal Info Card -->
                <div class="col-md-6 mb-4">
                    <div class="card card-primary card-outline shadow-sm">
                        <div class="card-header">
                            <h3 class="card-title m-0"><i class="bi bi-person-gear me-2"></i>Edit Profile Info</h3>
                        </div>
                        <form th:action="@{/admin/profile/update}" method="post">
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" name="username" class="form-control" th:value="${user.username}" required>
                                    <div class="form-text text-warning"><i class="bi bi-exclamation-triangle"></i> Changing your username will require you to log in again.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email address</label>
                                    <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Role</label>
                                    <input type="text" class="form-control" th:value="${user.role}" disabled>
                                </div>
                            </div>
                            <div class="card-footer text-end">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card card-warning card-outline shadow-sm">
                        <div class="card-header">
                            <h3 class="card-title m-0"><i class="bi bi-shield-lock me-2"></i>Change Password</h3>
                        </div>
                        <form th:action="@{/admin/profile/update-password}" method="post">
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" name="oldPassword" class="form-control" placeholder="Enter current password" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password" name="newPassword" class="form-control" placeholder="Enter new password" required>
                                </div>
                            </div>
                            <div class="card-footer text-end">
                                <button type="submit" class="btn btn-warning">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
