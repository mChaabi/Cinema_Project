<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}"> 
<head>
    <title>Genres List</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4">Genre Management</h2>
            
            <!-- Success/Delete Alerts -->
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                Genre saved successfully! 
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.deleted}" class="alert alert-warning alert-dismissible fade show" role="alert">
                Genre deleted successfully! 
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-primary card-outline shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title m-0">Movie Genres List</h3>
                    <!-- Link to Add Page -->
                    <a th:href="@{/admin/genres/add}" class="btn btn-sm btn-primary ms-auto">
                        <i class="bi bi-plus-lg"></i> Add New Genre
                    </a>
                </div>
                
                <div class="card-body">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 10%">ID</th>
                                <th>Name (Libelle)</th>
                                <th style="width: 15%" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="genre : ${genres}">
                                <td th:text="${genre.id}">1</td>
                                <td th:text="${genre.libelle}">Action</td>
                                
                                <!-- Edit & Delete Actions -->
                                <td class="text-center">
                                    <!-- Edit Button -->
                                    <a th:href="@{/admin/genres/edit/{id}(id=${genre.id})}" class="btn btn-sm btn-info text-white me-1">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    
                                    <!-- Delete Form -->
                                    <form th:action="@{/admin/genres/delete/{id}(id=${genre.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this genre?');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(genres)}">
                                <td colspan="3" class="text-center text-muted py-4">No genres found in the database.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
