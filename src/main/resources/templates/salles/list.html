<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout}"> 
<head>
    <title>Salles List</title>
</head>
<body>

    <main layout:fragment="content" class="p-4">
        <div class="container-fluid">
            <h2 class="mb-4">Salle Management</h2>
            
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                Cinema hall saved successfully! 
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${param.deleted}" class="alert alert-warning alert-dismissible fade show" role="alert">
                Cinema hall deleted successfully! 
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-primary card-outline shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title m-0">Cinema Halls List</h3>
                    <a th:href="@{/admin/salles/add}" class="btn btn-sm btn-primary ms-auto">
                        <i class="bi bi-plus-lg"></i> Add New Salle
                    </a>
                </div>
                
                <div class="card-body">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 10%">ID</th>
                                <th>Room Number</th>
                                <th>Capacity (Seats)</th>
                                <th style="width: 15%" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="salle : ${salles}">
                                <td th:text="${salle.id}">1</td>
                                
                                <td th:text="'Salle ' + ${salle.numero}">Salle 1</td>
                                
                                <td th:text="${salle.capacite}">250</td>
                                
                                <!-- Edit & Delete Actions -->
                                <td class="text-center">
                                    <a th:href="@{/admin/salles/edit/{id}(id=${salle.id})}" class="btn btn-sm btn-info text-white me-1">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    
                                    <form th:action="@{/admin/salles/delete/{id}(id=${salle.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this cinema hall?');">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(salles)}">
                                <td colspan="4" class="text-center text-muted py-4">No cinema halls found in the database.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
